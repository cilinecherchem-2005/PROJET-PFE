{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card card-soft shadow-sm">
      <div class="card-body p-4">
        <h3 class="card-title mb-3" data-i18n="connexion_titre">Connexion</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label" data-i18n="label_email">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="label_motdepasse">Mot de passe</label>
            <input type="password" name="mot_de_passe" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" data-i18n="bouton_connexion">Se connecter</button>
        </form>
        <div class="mt-3 text-center small text-muted" data-i18n="pas_de_compte">Pas de compte ?</div>
        <a href="{{ url_for('inscription') }}" class="btn btn-outline-secondary w-100 mt-2" data-i18n="bouton_inscription">Créer un compte</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
