{% extends 'base.html' %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card" style="padding:20px;">
        <h2 class="mb-2" data-i18n-key="connexion_titre">Connexion</h2>
        <p class="small-muted">Connectez-vous pour accéder au dashboard.</p>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label" for="email" data-i18n-key="label_email">Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="mot_de_passe" data-i18n-key="label_motdepasse">Mot de passe</label>
            <input type="password" id="mot_de_passe" name="mot_de_passe" class="form-control" required>
          </div>

          <button type="submit" class="btn" style="width:100%; background:linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%); color:white; border:none; border-radius:14px; font-weight:900;">
            <span data-i18n-key="bouton_connexion">Se connecter</span>
          </button>

          <div class="text-center mt-3 small-muted">
            <span data-i18n-key="pas_de_compte">Pas de compte ?</span>
            <a href="{{ url_for('inscription') }}" class="fw-bold ms-2" style="color:var(--primary); text-decoration:none;"> <span data-i18n-key="bouton_inscription">Créer un compte</span></a>
          </div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
