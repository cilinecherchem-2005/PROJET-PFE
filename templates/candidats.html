{% extends 'base.html' %}

{% block content %}
<div class="row">
  <div class="col-12">
    <div class="card shadow-sm card-soft">
      <div class="card-header">
        <h5 data-i18n="titre_candidats">Classement des candidats</h5>
      </div>
      <div class="card-body table-responsive">
        <table class="table table-borderless table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th data-i18n="col_nom">Nom du fichier</th>
              <th data-i18n="col_score">Score</th>
              <th data-i18n="col_offre">Offre liée</th>
              <th data-i18n="col_date">Date</th>
            </tr>
          </thead>
          <tbody>
            {% for cv in cvs %}
            <tr>
              <td>{{ cv.nom_fichier }}</td>
              <td>{{ cv.score }}%</td>
              <td>{{ cv.offre_id if cv.offre_id else '---' }}</td>
              <td>{{ cv.date.strftime('%d/%m/%Y') }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
